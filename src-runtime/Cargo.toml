[package]
name = "dmx-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Platform integration for DMX Controller App: transports, render loops and device watchers."

[lib]
crate-type = ["rlib"]

[features]
default = ["visualizer", "audio", "midi", "serial"]
visualizer = ["dep:ddp-rs", "dep:naga", "dep:wgpu", "dep:bytemuck"]
audio = ["dep:cpal", "dep:rustfft"]
midi = ["dep:midir"]
serial = ["dep:open_dmx", "dep:serialport"]

[dependencies]
dmx-engine = { path = "../src-engine" }
log = "0.4"
prost = "0.14.1"
reqwest = { version = "0.12.28", features = ["json"] }
sacn = "0.11.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.48.0", features = ["time", "macros", "sync", "net", "rt-multi-thread"] }

bytemuck = { version = "1.21", features = ["derive"], optional = true }
cpal = { version = "0.17", optional = true }
ddp-rs = { version = "1.2.1", optional = true }
midir = { version = "0.10.2", optional = true }
open_dmx = { version = "1.1.1", optional = true }
rustfft = { version = "6", optional = true }
serialport = { version = "4.7.3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
alsa-sys = "0.3"
libc = "0.2"

# wgpu and naga take different backends per platform, which is a property of
# the target rather than of any feature.
[target.'cfg(not(target_os = "ios"))'.dependencies]
naga = { version = "26.0", features = ["glsl-in", "spv-out"], optional = true }
wgpu = { version = "26.0", features = ["vulkan", "metal", "wgsl", "glsl"], optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
naga = { version = "26.0", default-features = false, features = ["glsl-in", "spv-out"], optional = true }
wgpu = { version = "26.0", default-features = false, features = ["metal", "wgsl", "glsl"], optional = true }

[lints.rust]
dead_code = "deny"
deprecated = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow some pedantic lints that are too noisy
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
