[package]
name = "dmx_controller_app"
version = "0.1.0"
description = "A lighting controller for DMX and friends."
authors = ["wmmiii"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.85.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
axum = "0.8"
base64 = "0.22"
chrono = "0.4.44"
dmx-engine = { path = "../src-engine" }
dmx-runtime = { path = "../src-runtime" }
log = "0.4"
png = "0.17"
prost = "0.14.1"
reqwest = { version = "0.12.28", features = ["json"] }
rmcp = { version = "2.2.0", features = ["server", "macros", "transport-streamable-http-server"] }
sanitize-filename = "0.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.147"
mime_guess = "2"
sha256 = "1.6.0"
tauri = { version = "2.10", features = [] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tokio = { version = "1.48.0", features = ["time", "macros", "sync", "net", "rt-multi-thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
alsa-sys = "0.3"
libc = "0.2"

[target.'cfg(not(target_os = "ios"))'.dependencies]
cpal = "0.17"
midir = "0.10.2"
tauri-plugin-keepawake = "0.1.0"

[lints.rust]
dead_code = "deny"
deprecated = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow some pedantic lints that are too noisy
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
