name: CI

on: [pull_request, workflow_dispatch]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/setup

      - name: Generate protobufs
        run: pnpm run proto:generate

      - name: Build WASM engine
        run: pnpm run wasm:build

      - name: Type check
        run: pnpm run type-check

      - name: Lint TypeScript (ESLint)
        run: pnpm run lint:ts

      - name: Check for dead code (Knip)
        run: pnpm run lint:dead

      - name: Lint Rust (Clippy)
        run: pnpm run lint:rust

      - name: Build headless binary
        run: cargo build --release -p dmx-controller-headless

      # Nothing else exercises the crate with its subsystems gated off, and the
      # lints are deny-level, so feature rot would otherwise only surface on a
      # minimal build someone runs by hand.
      - name: Check headless binary without optional subsystems
        run: cargo check -p dmx-controller-headless --no-default-features

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
