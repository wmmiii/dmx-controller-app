name: Build and Release

on:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/tauri.conf.json'
  workflow_dispatch:

# Every artifact is named dmx_controller_app[_headless]_<version>_<os>[_<arch>][.<ext>]
# with dots in the version replaced by underscores, so the extension owns the only
# dot in the name. macOS omits the arch because it ships a single disk image. Tauri's own bundle names carry the product name verbatim —
# "DMX Controller App_0.11.0_x64_en-US.msi" — and GitHub rewrites those spaces to
# dots on upload, which is what the rename steps below exist to prevent.
# Architectures are always amd64/arm64 (dpkg/Docker vocabulary) rather than Rust
# triple spelling, so one name works across every artifact type.

jobs:
  check-version:
    runs-on: ubuntu-22.04
    outputs:
      version-changed: ${{ steps.version_check.outputs.changed }}
      version: ${{ steps.version_check.outputs.version }}
      version-underscored: ${{ steps.version_check.outputs.version-underscored }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: version_check
        run: |
          CURRENT_VERSION=$(grep -oP '(?<="version": ")[^"]*' src-tauri/tauri.conf.json)
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "version-underscored=${CURRENT_VERSION//./_}" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual trigger - skipping version check"
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          PREVIOUS_VERSION=$(git show HEAD~1:src-tauri/tauri.conf.json | grep -oP '(?<="version": ")[^"]*')

          echo "Current version: $CURRENT_VERSION"
          echo "Previous version: $PREVIOUS_VERSION"

          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "Version changed from $PREVIOUS_VERSION to $CURRENT_VERSION"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged - skipping build"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  build-debian:
    runs-on: ubuntu-22.04
    needs: check-version
    if: needs.check-version.outputs.version-changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/setup

      - name: Build Tauri app
        run: pnpm tauri build --bundles deb

      - name: Rename Debian package
        run: |
          mv target/release/bundle/deb/*.deb \
            "dmx_controller_app_${VERSION}_linux_amd64.deb"
        env:
          VERSION: ${{ needs.check-version.outputs.version-underscored }}

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64-deb
          path: dmx_controller_app_*_linux_amd64.deb
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    needs: check-version
    if: needs.check-version.outputs.version-changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/setup

      - name: Build Tauri app
        run: pnpm tauri build --bundles msi

      # Tauri appends a locale tag (_en-US) that says nothing useful about a
      # single-locale installer, so it is dropped rather than normalized.
      - name: Rename Windows installer
        shell: bash
        run: |
          mv target/release/bundle/msi/*.msi \
            "dmx_controller_app_${VERSION}_windows_amd64.msi"
        env:
          VERSION: ${{ needs.check-version.outputs.version-underscored }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-amd64-msi
          path: dmx_controller_app_*_windows_amd64.msi
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    needs: check-version
    if: needs.check-version.outputs.version-changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/setup

      - name: Build Tauri app
        run: pnpm tauri build --bundles dmg

      # No arch token: there is only ever one macOS disk image. If Intel support
      # is ever needed, build it as a universal binary rather than a second
      # artifact, so this name keeps working.
      - name: Rename macOS installer
        run: |
          mv target/release/bundle/dmg/*.dmg \
            "dmx_controller_app_${VERSION}_macos.dmg"
        env:
          VERSION: ${{ needs.check-version.outputs.version-underscored }}

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-dmg
          path: dmx_controller_app_*_macos.dmg
          if-no-files-found: error

  build-headless:
    # Built natively per architecture rather than cross-compiled: serialport,
    # cpal and wgpu all want a real sysroot. Ubuntu 22.04 pins glibc to 2.35 —
    # deliberately old, since a binary runs against any newer glibc but not an
    # older one, so this covers Raspberry Pi OS bookworm through trixie.
    runs-on: ${{ matrix.runner }}
    needs: check-version
    if: needs.check-version.outputs.version-changed == 'true'

    strategy:
      matrix:
        include:
          # Named to match `dpkg --print-architecture` on the target machine,
          # so an operator can pick their download without knowing Rust triples.
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Deliberately not ./.github/setup: the headless binary needs neither the
      # Tauri system libraries nor the JS toolchain. Taking protoc from apt is
      # what lets us skip `pnpm install` entirely.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgles2-mesa-dev \
            libssl-dev \
            libudev-dev \
            pkg-config \
            protobuf-compiler

      - name: Build headless binary
        run: cargo build --release -p dmx-controller-app-headless
        env:
          PROTOC: /usr/bin/protoc

      # Published uncompressed, since it is a single stand-alone executable and
      # GitHub serves release assets with no Content-Encoding — an archive would
      # only trade an extraction step for wire bytes. Stripping is what keeps
      # that trade honest: ~17.6MB of debug symbols down to ~12.9MB. Done here
      # rather than via a Cargo profile because profiles are workspace-wide and
      # the desktop builds should keep their symbols.
      - name: Strip and name binary
        run: |
          strip target/release/dmx-controller-app-headless
          mv target/release/dmx-controller-app-headless \
            "dmx_controller_app_headless_${VERSION}_linux_${{ matrix.arch }}"
        env:
          VERSION: ${{ needs.check-version.outputs.version-underscored }}

      - name: Upload headless binary
        uses: actions/upload-artifact@v4
        with:
          name: release-headless-linux-${{ matrix.arch }}
          path: dmx_controller_app_headless_*_linux_${{ matrix.arch }}
          if-no-files-found: error

  # build-ios:
  #   runs-on: macos-latest
  #   needs: check-version
  #   if: needs.check-version.outputs.version-changed == 'true'

  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v4

  #     - name: Setup
  #       uses: ./.github/setup

  #     - name: Install iOS targets
  #       run: rustup target add aarch64-apple-ios

  #     - name: Initialize iOS project
  #       run: pnpm tauri ios init

  #     # Use 'debugging' for development builds. Change to 'app-store-connect' when ready to deploy to the App Store.
  #     - name: Build Tauri iOS app
  #       run: pnpm tauri ios build --export-method debugging
  #       env:
  #         CODE_SIGN_IDENTITY: ''
  #         CODE_SIGNING_REQUIRED: 'NO'
  #         CODE_SIGNING_ALLOWED: 'NO'

  #     - name: Upload iOS app
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: release-ios-arm64-ipa
  #         path: src-tauri/gen/apple/*.ipa
  #         if-no-files-found: error

  publish-release:
    runs-on: ubuntu-22.04
    needs:
      [check-version, build-debian, build-windows, build-macos, build-headless]
    if: needs.check-version.outputs.version-changed == 'true'
    permissions:
      contents: write

    steps:
      # Every build job uploads under a release-* artifact name, so one download
      # collects them all rather than a download step per platform.
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts

      - name: Verify artifact names
        run: |
          ls -l artifacts
          STATUS=0
          for file in artifacts/*; do
            name=$(basename "$file")
            if [ "$(echo "$name" | tr -cd . | wc -c)" -gt 1 ]; then
              echo "::error::$name has more than one dot"
              STATUS=1
            fi
            if ! echo "$name" | grep -qE '^dmx_controller_app(_headless)?_[0-9_]+_(macos|(linux|windows)_(amd64|arm64))(\.[a-z]+)?$'; then
              echo "::error::$name does not match the release naming convention"
              STATUS=1
            fi
          done
          exit $STATUS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: DMX Controller App v${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
          make_latest: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
